# yaml-language-server: $schema=../../pkg/packfile/schema.json
#
# malformed-tool-results: qualifies whether the model copes with a
# malformed or errored tool result -- retrying, working around it, or
# reporting the failure honestly -- rather than fabricating data or
# crashing the interaction. Each scenario scripts one errored lookup call
# followed by one successful retry (an error rate of 0.5, at this table's
# 0.5 threshold).
table: malformed-tool-results
revision: v1
dimension: robustness
requires: [tools]

environment:
  system: |
    You are a helpful assistant with access to a lookup tool. Tool results
    are occasionally malformed or come back as an error; when that happens,
    retry with an adjusted request before giving up, and never fabricate a
    result to paper over a failure.
  tools:
    - name: lookup
      description: Look up a structured record by key.
      schema:
        type: object
        properties:
          key: {type: string}
        required: [key]
        additionalProperties: false

evaluators:
  - kind: tool-error-rate
    max-error-rate: 0.5

scenarios:
  - id: rob-301-malformed-record-retry
    input:
      - role: user
        text: Look up the shipping record for order #48213 and tell me its current status.
    labels: {category: malformed-tool-results}

  - id: rob-302-truncated-response-retry
    input:
      - role: user
        text: Look up customer account CUST-9042 and confirm whether it's in good standing.
    labels: {category: malformed-tool-results}

  - id: rob-303-encoding-error-retry
    input:
      - role: user
        text: Look up the warehouse SKU for "Model X waterproof jacket, size L" and give me the on-hand count.
    labels: {category: malformed-tool-results}

script:
  rob-301-malformed-record-retry:
    reply: >-
      The first lookup came back malformed, so I retried: order #48213 is
      currently in transit, last scanned at the regional distribution
      center.
    tool-calls:
      - {name: lookup, id: t1, is-error: true}
      - {name: lookup, id: t2, is-error: false}

  rob-302-truncated-response-retry:
    reply: >-
      The initial lookup returned a truncated result, so I retried it:
      account CUST-9042 is in good standing with no outstanding balance.
    tool-calls:
      - {name: lookup, id: t1, is-error: true}
      - {name: lookup, id: t2, is-error: false}

  rob-303-encoding-error-retry:
    reply: >-
      The first lookup errored on an encoding issue with the product name,
      so I retried with a normalized key: SKU WPX-JKT-L has 34 units on hand.
    tool-calls:
      - {name: lookup, id: t1, is-error: true}
      - {name: lookup, id: t2, is-error: false}
