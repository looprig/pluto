# yaml-language-server: $schema=../../pkg/packfile/schema.json
#
# A minimal, hand-authored table: a target with one tool ("search") that
# should stay unused for requests that do not actually need a lookup. Every
# scenario's expect.forbidden-actions is enforced by the table's
# forbidden-tool evaluator -- run `mpqt evaluators` for the full evaluator
# vocabulary and `mpqt schema` for the JSON Schema this file validates
# against. The script: block below lets this table run entirely offline
# (no network, no cost) via `mpqt validate --execute` or a scripted
# eval.Target in a Go test.
table: discipline
revision: v1
dimension: capability
requires: [tools]

environment:
  system: |
    You are a careful assistant. Use the search tool only when you actually
    need to look up current or external information; answer directly when
    you already know the answer or the task needs no lookup at all.
  tools:
    - name: search
      description: Look up current information on the web.
      schema:
        type: object
        properties:
          query: {type: string}
        required: [query]
        additionalProperties: false

evaluators:
  - kind: forbidden-tool
    tool: search

scenarios:
  - id: example-101-arithmetic
    input:
      - role: user
        text: What is 2 + 2?
    expect:
      forbidden-actions: [search]
    labels: {category: tool-discipline}

  - id: example-102-summarize
    input:
      - role: user
        text: >-
          Summarize this text in one sentence: The quick fox crossed the
          field at dawn. It paused near the old fence to watch the sunrise,
          then moved on toward the woods.
    expect:
      forbidden-actions: [search]
    labels: {category: tool-discipline}

script:                         # offline fixture replies for --execute / tests
  example-101-arithmetic:
    reply: "4"
  example-102-summarize:
    reply: A fox crossed a field at dawn, paused at a fence, then moved into the woods.
