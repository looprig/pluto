name: Docs examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run deterministic offline examples
        run: GOWORK=off go test -race ./examples/...
      - name: Run repository checks and validate shipped packs
        run: GOWORK=off make test build packs
      - name: Run standalone root-module race tests
        run: GOWORK=off go test -race ./...
      - name: Run standalone CLI-module race tests
        run: cd cmd/pluto && GOWORK=off go test -race ./...
